!
! =====================================================================
! TOR-WH-RTR-01  (ISR4331)  -  Toronto warehouse
! Stub site behind TOR-RTR-01: legacy RIPv2, router-on-a-stick, local DHCP
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
!
! ===== Phase 11: base, RIP, DHCP ===================================
!
hostname TOR-WH-RTR-01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
!
! No Loopback0: RIP would carry it into EIGRP, and a 10.255.255.x/32 falls
! outside Toronto's 10.40.0.0/16 summary, so London would see a new route (ADR 0016).
! B-56: PT has no 'ip rip' interface commands (no RIP MD5 or plain-text auth on
! the ISR4331 or the 2911), so the RIP link is unauthenticated. It is a single
! cable between two company routers with every other RIP interface passive.
interface GigabitEthernet0/0/0
 description TO-TOR-RTR-01-Gi0/2
 ip address 10.40.0.14 255.255.255.252
 no shutdown
interface GigabitEthernet0/0/1
 description TO-TOR-WH-SW-01-Gi0/1
 no shutdown
! Router-on-a-stick: one router is the whole site, so a single trunk adds no new
! single point of failure (ADR 0016). VLAN 999 is the switch's native VLAN and
! has no subinterface, so untagged frames are dropped here.
interface GigabitEthernet0/0/1.10
 description WH-MGMT
 encapsulation dot1Q 10
 ip address 10.40.102.1 255.255.255.0
interface GigabitEthernet0/0/1.20
 description WH-USERS
 encapsulation dot1Q 20
 ip address 10.40.100.1 255.255.255.0
interface GigabitEthernet0/0/2
 shutdown
!
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
! The only RIP neighbour is TOR-RTR-01, which sends a default route.
!
ip dhcp excluded-address 10.40.100.1 10.40.100.99
ip dhcp excluded-address 10.40.100.251 10.40.100.255
ip dhcp pool WH-USERS
 network 10.40.100.0 255.255.255.0
 default-router 10.40.100.1
 dns-server 10.10.80.10
 domain-name corp.bosphorus.test
!
ip access-list extended ACL-WH-DATA-IN
 remark Warehouse users: same off-site policy as ACL-BRANCH-DATA-IN, plus no WH MGMT
 permit udp any any eq bootps
 deny ip any 10.40.102.0 0.0.0.255
 deny ip any 10.40.10.0 0.0.0.255
 deny ip any 10.40.0.0 0.0.0.255
 permit ip 10.40.0.0 0.0.255.255 10.40.0.0 0.0.255.255
 permit tcp 10.40.0.0 0.0.255.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.40.0.0 0.0.255.255 10.10.10.0 0.0.0.255 echo-reply
 permit udp 10.40.0.0 0.0.255.255 host 10.10.80.10 eq domain
 permit tcp 10.40.0.0 0.0.255.255 host 10.10.80.10 eq domain
 permit tcp 10.40.0.0 0.0.255.255 host 10.10.80.13 eq www
 permit tcp 10.40.0.0 0.0.255.255 host 10.10.80.13 eq 443
 permit tcp 10.40.0.0 0.0.255.255 host 10.10.80.13 eq smtp
 permit tcp 10.40.0.0 0.0.255.255 host 10.10.80.13 eq pop3
 permit icmp 10.40.0.0 0.0.255.255 10.10.80.0 0.0.0.255 echo
 permit tcp 10.40.0.0 0.0.255.255 host 172.16.100.10 eq www
 permit tcp 10.40.0.0 0.0.255.255 host 172.16.100.10 eq 443
 permit ip 10.40.0.0 0.0.255.255 10.10.20.0 0.0.0.255
 permit ip 10.40.0.0 0.0.255.255 10.10.30.0 0.0.0.255
 permit ip 10.40.0.0 0.0.255.255 10.10.60.0 0.0.0.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.40.0.0 0.0.255.255 any
interface GigabitEthernet0/0/1.20
 ip access-group ACL-WH-DATA-IN in
!
! ===== Phase 11: management plane (as Phase 7) =====================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
! B-51: PT rejects 'no ip http server' (no HTTP server runs anyway).
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! B-01: the AAA client registered on LON-SRV-AAA-01 is 10.40.0.14 (outgoing interface).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 4
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
! B-51: PT rejects 'logging trap informational'; the default trap level is used.
snmp-server community BSP-RO-Lab RO
! P0-16d: PT rejects an ACL on the community; ACL 99 still limits VTY access.
!
! ===== Phase 12: CCTV (VLAN 90) ====================================
!
interface GigabitEthernet0/0/1.90
 description WH-CCTV
 encapsulation dot1Q 90
 ip address 10.40.101.1 255.255.255.0
! Cameras are static (10.40.101.11-12), not DHCP (B-58). No CCTV pool.
ip access-list extended ACL-CCTV-IN
 remark Cameras: HSRP, DHCP, then IoT registration (TCP 31000) to LON-SRV-IOT-01 only
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.40.101.0 0.0.0.255 10.40.101.0 0.0.0.255
 permit tcp 10.40.101.0 0.0.0.255 host 10.10.80.14 eq 31000
 deny ip any any
interface GigabitEthernet0/0/1.90
 ip access-group ACL-CCTV-IN in
! PT doesn't apply 'passive-interface default' to a subinterface created later (B-57).
router rip
 passive-interface GigabitEthernet0/0/1.90
! Warehouse users: no cameras here or in Toronto (seq 25/26, after the WH MGMT deny).
ip access-list extended ACL-WH-DATA-IN
 25 deny ip any 10.40.101.0 0.0.0.255
 26 deny ip any 10.40.90.0 0.0.0.255
!
end
! After pasting: copy running-config startup-config
