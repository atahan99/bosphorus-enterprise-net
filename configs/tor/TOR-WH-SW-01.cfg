!
! =====================================================================
! TOR-WH-SW-01  (2960-24TT)  -  Toronto warehouse
! Access switch: warehouse users, CCTV, single trunk to TOR-WH-RTR-01
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! B-24: upgrade to IOS 15 first (build guide, Phase 11), or the DAI lines fail.
! =====================================================================
!
!
! ===== Phase 11: switching =========================================
!
hostname TOR-WH-SW-01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
vtp mode transparent
vtp domain BOSPHORUS
spanning-tree mode rapid-pvst
vlan 10
 name MGMT
vlan 20
 name USERS
vlan 998
 name PARKING
vlan 999
 name NATIVE-UNUSED
! --- Uplink (P0-02b: PT has no loop guard) ---
interface GigabitEthernet0/1
 description TO-TOR-WH-RTR-01-Gi0/0/1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,999
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
! --- Access ports ---
interface FastEthernet0/1
 description WH-USER (TOR-WH-PC-01)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
! --- Unused ports ---
interface range FastEthernet0/2 - 24
 switchport mode access
 switchport access vlan 998
 shutdown
interface GigabitEthernet0/2
 switchport mode access
 switchport access vlan 998
 shutdown
interface Vlan1
 shutdown
interface Vlan10
 description MGMT
 ip address 10.40.102.2 255.255.255.0
 no shutdown
ip default-gateway 10.40.102.1
!
! ===== Phase 11: Layer 2 security ==================================
!
ip dhcp snooping vlan 10,20
ip dhcp snooping
no ip dhcp snooping information option
! Without the line above the switch inserts option 82 with giaddr 0 and the
! router's DHCP server drops the requests.
ip arp inspection vlan 20
! P0-05a: PT accepts DAI (2960 needs IOS 15, B-24) but does not drop; kept as a documented control.
! P0-03: PT has no errdisable recovery; recover a port with shutdown / no shutdown.
!
! ===== Phase 11: management plane (as Phase 7) =====================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
! B-51: the 2960 (IOS 15.0) rejects 'login block-for'; routers and 3650s keep it.
! B-51: PT rejects 'no ip http server' (no HTTP server runs anyway).
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! The AAA client registered on LON-SRV-AAA-01 is 10.40.102.2 (Vlan10).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
! B-51: PT rejects 'logging trap informational'; the default trap level is used.
snmp-server community BSP-RO-Lab RO
! P0-16d: PT rejects an ACL on the community; ACL 99 still limits VTY access.
!
! ===== Phase 12: CCTV (VLAN 90) ====================================
!
vlan 90
 name CCTV
interface GigabitEthernet0/1
 switchport trunk allowed vlan add 90
interface FastEthernet0/2
 description CCTV (TOR-WH-CAM-01, static 10.40.101.11)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 90
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip arp inspection trust
 no shutdown
interface FastEthernet0/3
 description CCTV (TOR-WH-CAM-02, static 10.40.101.12)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 90
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip arp inspection trust
 no shutdown
ip dhcp snooping vlan 90
ip arp inspection vlan 90
! Static cameras (B-58): DAI trusted on their ports, as for the printers (ADR 0012).
!
end
! After pasting: copy running-config startup-config
