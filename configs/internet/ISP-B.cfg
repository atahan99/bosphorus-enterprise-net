!
! =====================================================================
! ISP-B  (Router-PT)  -  Simulated internet
! AS 65002. Part of the lab's 'internet', not a showcase device.
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
!
! ===== Phase 5: base, interfaces, BGP ==============================
!
hostname ISP-B
no ip domain-lookup
enable secret Lab-Enable-1
interface FastEthernet0/0
 description TO-LON-EDGE-02-Gi0/0/0
 ip address 198.51.100.5 255.255.255.252
 no shutdown
interface FastEthernet1/0
 description TO-CHI-FW-01-Gi1/1
 ip address 198.51.100.13 255.255.255.252
 no shutdown
interface FastEthernet4/0
 description TO-ISP-A-Fa4/0
 ip address 198.51.100.18 255.255.255.252
 no shutdown
interface FastEthernet5/0
 description TO-INET-CORE-Fa1/0
 ip address 198.51.100.25 255.255.255.252
 no shutdown
! P0-11e: PT has no 'neighbor ... default-originate'. A static default to Null0 plus
! 'network 0.0.0.0' advertises 0.0.0.0/0 to the customer instead (verified in Phase 0).
! P0-11c/f: no prefix-lists or session passwords in PT, so the customer session is unfiltered.
ip route 0.0.0.0 0.0.0.0 Null0
router bgp 65002
 bgp router-id 198.51.100.25
 bgp log-neighbor-changes
 network 0.0.0.0 mask 0.0.0.0
 network 198.51.100.4 mask 255.255.255.252
 network 198.51.100.12 mask 255.255.255.252
 network 198.51.100.16 mask 255.255.255.252
 network 198.51.100.24 mask 255.255.255.252
 neighbor 198.51.100.6 remote-as 65100
 neighbor 198.51.100.17 remote-as 65001
 neighbor 198.51.100.26 remote-as 65000
!
end
! After pasting: copy running-config startup-config
