!
! =====================================================================
! INET-CORE  (Router-PT)  -  Simulated internet
! AS 65000. Part of the lab's 'internet', not a showcase device.
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
!
! ===== Phase 5: base, interfaces, BGP ==============================
!
hostname INET-CORE
no ip domain-lookup
enable secret Lab-Enable-1
interface FastEthernet0/0
 description TO-ISP-A-Fa5/0
 ip address 198.51.100.22 255.255.255.252
 no shutdown
interface FastEthernet1/0
 description TO-ISP-B-Fa5/0
 ip address 198.51.100.26 255.255.255.252
 no shutdown
interface FastEthernet4/0
 description TO-INET-SW-Fa0/1
 ip address 192.0.2.1 255.255.255.0
 no shutdown
router bgp 65000
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 network 192.0.2.0 mask 255.255.255.0
 neighbor 198.51.100.21 remote-as 65001
 neighbor 198.51.100.21 description ISP-A
 neighbor 198.51.100.25 remote-as 65002
 neighbor 198.51.100.25 description ISP-B
!
end
! After pasting: copy running-config startup-config
