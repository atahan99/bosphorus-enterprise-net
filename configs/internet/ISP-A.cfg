!
! =====================================================================
! ISP-A  (Router-PT)  -  Simulated internet
! AS 65001. Part of the lab's 'internet', not a showcase device.
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Lines tagged "P0-xx" depend on a Phase 0 result: if the command above
! the tag is rejected, use the fallback given in the tag instead.
! =====================================================================
!
!
! ===== Phase 5: base, interfaces, BGP ==============================
!
hostname ISP-A
no ip domain-lookup
enable secret Lab-Enable-1
interface FastEthernet0/0
 description TO-LON-EDGE-01-Gi0/0/0
 ip address 198.51.100.1 255.255.255.252
 no shutdown
interface FastEthernet1/0
 description TO-IST-RTR-01-Gi0/0/0
 ip address 198.51.100.9 255.255.255.252
 no shutdown
interface FastEthernet4/0
 description TO-ISP-B-Fa4/0
 ip address 198.51.100.17 255.255.255.252
 no shutdown
interface FastEthernet5/0
 description TO-INET-CORE-Fa0/0
 ip address 198.51.100.21 255.255.255.252
 no shutdown
! Accept only the customer's own block from London (basic ISP hygiene).
ip prefix-list PL-CUSTOMER-IN seq 5 permit 203.0.113.0/24
router bgp 65001
 bgp router-id 198.51.100.21
 bgp log-neighbor-changes
 network 198.51.100.0 mask 255.255.255.252
 network 198.51.100.8 mask 255.255.255.252
 network 198.51.100.16 mask 255.255.255.252
 network 198.51.100.20 mask 255.255.255.252
 neighbor 198.51.100.2 remote-as 65100
 neighbor 198.51.100.2 description CUSTOMER-LON-EDGE-01
 neighbor 198.51.100.2 password Lab-Bgp-1
 neighbor 198.51.100.2 default-originate
 neighbor 198.51.100.2 prefix-list PL-CUSTOMER-IN in
 neighbor 198.51.100.18 remote-as 65002
 neighbor 198.51.100.18 description ISP-B
 neighbor 198.51.100.22 remote-as 65000
 neighbor 198.51.100.22 description INET-CORE
! P0-11a: if Router-PT can't run BGP, replace this device with an ISR4331 + NIM-ES2-4
! and use GigabitEthernet port names in the same positions.
!
end
! After pasting: copy running-config startup-config
