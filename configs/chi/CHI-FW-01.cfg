!
! =====================================================================
! CHI-FW-01  (ASA 5506-X)  -  Chicago
! Office firewall (36 staff): PAT, static routing, a link to each site switch, IPsec to LON-EDGE-02 with EDGE-01 as backup peer
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Lines tagged "P0-xx" depend on a Phase 0 result: if the command above
! the tag is rejected, use the fallback given in the tag instead.
! =====================================================================
!
! ASA note: paste in configure terminal after 'enable' (no enable password yet on a
! fresh ASA: just press Enter). ASA uses subnet masks, not wildcard masks.
!
! ===== Phase 2: base ===============================================
!
hostname CHI-FW-01
domain-name corp.bosphorus.test
! A fresh 5506-X has a DHCP pool on the inside in 192.168.1.0/24. Remove it before
! changing the inside address (check with: show running-config dhcpd).
! DHCP for Chicago is served by the two site switches, not the ASA.
no dhcpd enable inside
no dhcpd address 192.168.1.5-192.168.1.36 inside
interface GigabitEthernet1/1
 description TO-ISP-B-Fa1/0
 nameif outside
 security-level 0
 ip address 198.51.100.14 255.255.255.252
 no shutdown
interface GigabitEthernet1/2
 description TO-CHI-SW-01-Gi1/0/22
 nameif inside
 security-level 100
 ip address 10.30.0.1 255.255.255.252
 no shutdown
interface GigabitEthernet1/3
 description TO-CHI-SW-02-Gi1/0/22
 nameif inside2
 security-level 100
 ip address 10.30.0.5 255.255.255.252
 no shutdown
!
! ===== Phase 6: routing, NAT, inspection ===========================
!
route outside 0.0.0.0 0.0.0.0 198.51.100.13 1
! Return traffic to the site prefers CHI-SW-01; if that link or switch dies the
! floating route through CHI-SW-02 takes over.
route inside 10.30.0.0 255.255.0.0 10.30.0.2 1
route inside2 10.30.0.0 255.255.0.0 10.30.0.6 2
!
object network OBJ-INTERNAL-ALL
 subnet 10.0.0.0 255.0.0.0
object network OBJ-CHI-LAN
 subnet 10.30.0.0 255.255.0.0
object network OBJ-CHI-LAN-2
 subnet 10.30.0.0 255.255.0.0
! NAT exemption: traffic to the other sites must reach the crypto map untranslated.
! (Manual NAT is evaluated before the object NAT below.)
nat (inside,outside) source static OBJ-CHI-LAN OBJ-CHI-LAN destination static OBJ-INTERNAL-ALL OBJ-INTERNAL-ALL
nat (inside2,outside) source static OBJ-CHI-LAN OBJ-CHI-LAN destination static OBJ-INTERNAL-ALL OBJ-INTERNAL-ALL
! If these lines are rejected, note it: without the exemption, VPN traffic is PAT-translated.
! Workaround: remove the dynamic PAT below and test the VPN first, then report back.
object network OBJ-CHI-LAN
 nat (inside,outside) dynamic interface
object network OBJ-CHI-LAN-2
 nat (inside2,outside) dynamic interface
!
! ICMP isn't inspected by default, so pings to the internet would fail without this.
class-map inspection_default
 match default-inspection-traffic
policy-map global_policy
 class inspection_default
  inspect icmp
service-policy global_policy global
! If 'service-policy ... global' says it already exists, that's fine.
!
! ===== Phase 6: site-to-site VPN to London =========================
!
access-list VPN-TO-LON extended permit ip 10.30.0.0 255.255.0.0 10.0.0.0 255.0.0.0
crypto ipsec ikev1 transform-set TS-LON esp-aes-256 esp-sha-hmac
crypto map CM-OUTSIDE 10 match address VPN-TO-LON
crypto map CM-OUTSIDE 10 set peer 198.51.100.6 198.51.100.2
! Primary peer LON-EDGE-02, backup LON-EDGE-01 (tried if the primary doesn't answer).
! If a second peer is rejected, keep only 198.51.100.6 and note it (B-19).
crypto map CM-OUTSIDE 10 set ikev1 transform-set TS-LON
crypto map CM-OUTSIDE interface outside
crypto ikev1 policy 10
 authentication pre-share
 encryption aes-256
 hash sha
 group 14
 lifetime 86400
! If 'group 14' is rejected use 'group 5' (then 'group 2') and change
! 'crypto isakmp policy 20' on both London edges to match.
crypto ikev1 enable outside
tunnel-group 198.51.100.6 type ipsec-l2l
tunnel-group 198.51.100.6 ipsec-attributes
 ikev1 pre-shared-key Lab-Ike-2
tunnel-group 198.51.100.2 type ipsec-l2l
tunnel-group 198.51.100.2 ipsec-attributes
 ikev1 pre-shared-key Lab-Ike-2
!
! ===== Phase 7: management plane ===================================
!
enable password Lab-Enable-1
username netadmin password Lab-Admin-1 privilege 15
aaa authentication ssh console LOCAL
crypto key generate rsa modulus 2048
ssh 10.10.10.0 255.255.255.0 inside
ssh timeout 10
! London admins arrive through the VPN; this lets them manage the inside interface.
management-access inside
logging enable
logging timestamp
logging trap informational
logging host inside 10.10.80.12
ntp server 10.10.80.12
! If any line in this section is rejected, skip it and note it in the support matrix.
!
end
! After pasting: write memory
