!
! =====================================================================
! CHI-SW-02  (3650-24PS)  -  Chicago
! Branch switch 2 of 2: collapsed core/access, HSRP gateways, split-scope DHCP
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Lines tagged "P0-xx" depend on a Phase 0 result: if the command above
! the tag is rejected, use the fallback given in the tag instead.
! =====================================================================
!
! Physical tab: add AC-POWER-SUPPLY before powering on. The 3650-24PS supplies PoE,
! so phones and APs on this switch need no power adapter.
!
! ===== Phase 2: base ===============================================
!
hostname CHI-SW-02
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
!
! ===== Phase 6: switching ==========================================
!
vtp mode transparent
vtp domain BOSPHORUS
spanning-tree mode rapid-pvst
spanning-tree vlan 50,70 priority 24576
spanning-tree vlan 10,20,60,900 priority 28672
vlan 10
 name MGMT
vlan 20
 name USERS
vlan 50
 name VOICE
vlan 60
 name WIFI-CORP
vlan 70
 name WIFI-GUEST
vlan 900
 name TRANSIT
vlan 998
 name PARKING
vlan 999
 name NATIVE-UNUSED
! --- Po1: LACP bundle to the other switch of the pair ---
interface range GigabitEthernet1/0/23 - 24
 description TO-CHI-SW-01-Po1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,60,70,900,999
 channel-group 1 mode active
 no shutdown
interface Port-channel1
 description TO-CHI-SW-01-Po1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,60,70,900,999
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
! P0: if 'switchport trunk encapsulation dot1q' is rejected, ignore it (3650 is dot1q-only).
! --- Access ports ---
interface range GigabitEthernet1/0/1 - 18
 description DESK-USERS
 switchport mode access
 switchport nonegotiate
 switchport access vlan 20
 switchport voice vlan 50
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface GigabitEthernet1/0/1
 description DESK-USERS (CHI-PC-02)
interface GigabitEthernet1/0/21
 description CHI-AP-02 (SSID BSP-GUEST)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 70
 switchport port-security
 switchport port-security maximum 10
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ! Autonomous AP (AccessPoint-PT) bridging one SSID into this VLAN.
 ! maximum 10: the wireless clients' MACs are learned on this port.
 no shutdown
interface GigabitEthernet1/0/20
 description CHI-PRN-01 (static 10.30.20.20)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip arp inspection trust
 ! Static printer: no DHCP binding, so DAI would drop its ARP.
 ! Trusted here and locked to one sticky MAC (ADR 0012).
 no shutdown
! --- Spare ports ---
interface range GigabitEthernet1/0/19 - 19
 switchport mode access
 switchport access vlan 998
 shutdown
interface range GigabitEthernet1/1/1 - 4
 shutdown
interface Vlan1
 shutdown
!
! ===== Phase 6: Layer 2 security ===================================
!
ip dhcp snooping vlan 20,50,60,70
ip dhcp snooping
no ip dhcp snooping information option
! Without the line above the switch inserts option 82 and the core's DHCP relay
! drops the requests (giaddr 0 + option 82 from an untrusted source).
ip arp inspection vlan 20,50,60,70
! P0-05a: if DAI is rejected, delete this line and the 'ip arp inspection trust' lines.
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
errdisable recovery interval 60
! P0-03: if errdisable recovery is rejected, recover ports with shutdown / no shutdown.
! The DHCP servers are the two switches themselves; offers from the other
! switch arrive over Po1, which is trusted.
!
! ===== Phase 6: gateways, DHCP, routing ============================
!
ip routing
interface GigabitEthernet1/0/22
 description TO-CHI-FW-01-Gi1/3
 no switchport
 ip address 10.30.0.6 255.255.255.252
 no shutdown
interface Vlan900
 description TRANSIT-TO-CHI-SW-01
 ip address 10.30.0.10 255.255.255.252
 no shutdown
!
! HSRP: this switch is active for VLAN 50, 70; the other switch for the rest.
! Each switch tracks its uplink: if it fails, the other switch takes over its gateways.
track 1 interface GigabitEthernet1/0/22 line-protocol
! P0-07b fallback: replace 'standby N track 1 decrement 20' with 'standby N track GigabitEthernet1/0/22 20'.
interface Vlan10
 description MGMT
 ip address 10.30.10.3 255.255.255.0
 standby version 2
 standby 10 ip 10.30.10.1
 standby 10 priority 100
 standby 10 preempt
 standby 10 authentication md5 key-string Lab-Hsrp-1
 standby 10 track 1 decrement 20
 no shutdown
interface Vlan20
 description USERS
 ip address 10.30.20.3 255.255.255.0
 standby version 2
 standby 20 ip 10.30.20.1
 standby 20 priority 100
 standby 20 preempt
 standby 20 authentication md5 key-string Lab-Hsrp-1
 standby 20 track 1 decrement 20
 no shutdown
interface Vlan50
 description VOICE
 ip address 10.30.50.3 255.255.255.0
 standby version 2
 standby 50 ip 10.30.50.1
 standby 50 priority 110
 standby 50 preempt
 standby 50 authentication md5 key-string Lab-Hsrp-1
 standby 50 track 1 decrement 20
 no shutdown
interface Vlan60
 description WIFI-CORP
 ip address 10.30.60.3 255.255.255.0
 standby version 2
 standby 60 ip 10.30.60.1
 standby 60 priority 100
 standby 60 preempt
 standby 60 authentication md5 key-string Lab-Hsrp-1
 standby 60 track 1 decrement 20
 no shutdown
interface Vlan70
 description WIFI-GUEST
 ip address 10.30.70.3 255.255.255.0
 standby version 2
 standby 70 ip 10.30.70.1
 standby 70 priority 110
 standby 70 preempt
 standby 70 authentication md5 key-string Lab-Hsrp-1
 standby 70 track 1 decrement 20
 no shutdown
!
ip dhcp excluded-address 10.30.20.1 10.30.20.175
ip dhcp excluded-address 10.30.20.251 10.30.20.255
ip dhcp excluded-address 10.30.50.1 10.30.50.175
ip dhcp excluded-address 10.30.50.251 10.30.50.255
ip dhcp excluded-address 10.30.60.1 10.30.60.135
ip dhcp excluded-address 10.30.60.251 10.30.60.255
ip dhcp excluded-address 10.30.70.1 10.30.70.175
ip dhcp excluded-address 10.30.70.251 10.30.70.255
ip dhcp pool CHI-USERS
 network 10.30.20.0 255.255.255.0
 default-router 10.30.20.1
 dns-server 10.10.80.10
 domain-name corp.bosphorus.test
ip dhcp pool CHI-VOICE
 network 10.30.50.0 255.255.255.0
 default-router 10.30.50.1
 option 150 ip 10.10.50.10
ip dhcp pool CHI-WIFI-CORP
 network 10.30.60.0 255.255.255.0
 default-router 10.30.60.1
 dns-server 10.10.80.10
 domain-name corp.bosphorus.test
ip dhcp pool CHI-WIFI-GUEST
 network 10.30.70.0 255.255.255.0
 default-router 10.30.70.1
 dns-server 192.0.2.53
!
ip access-list extended ACL-BRANCH-DATA-IN
 remark Users and corp Wi-Fi: local site (not MGMT or transits), approved HQ services, peer London users, internet
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 deny ip any 10.30.10.0 0.0.0.255
 deny ip any 10.30.0.0 0.0.0.255
 permit ip 10.30.0.0 0.0.255.255 10.30.0.0 0.0.255.255
 permit tcp 10.30.0.0 0.0.255.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.30.0.0 0.0.255.255 10.10.10.0 0.0.0.255 echo-reply
 permit udp 10.30.0.0 0.0.255.255 host 10.10.80.10 eq domain
 permit tcp 10.30.0.0 0.0.255.255 host 10.10.80.10 eq domain
 permit udp 10.30.0.0 0.0.255.255 host 10.10.80.11 eq 1812
 permit udp 10.30.0.0 0.0.255.255 host 10.10.80.11 eq 1813
 permit tcp 10.30.0.0 0.0.255.255 host 10.10.80.13 eq www
 permit tcp 10.30.0.0 0.0.255.255 host 10.10.80.13 eq 443
 permit tcp 10.30.0.0 0.0.255.255 host 10.10.80.13 eq smtp
 permit tcp 10.30.0.0 0.0.255.255 host 10.10.80.13 eq pop3
 permit icmp 10.30.0.0 0.0.255.255 10.10.80.0 0.0.0.255 echo
 permit tcp 10.30.0.0 0.0.255.255 host 172.16.100.10 eq www
 permit tcp 10.30.0.0 0.0.255.255 host 172.16.100.10 eq 443
 permit ip 10.30.0.0 0.0.255.255 10.10.20.0 0.0.0.255
 permit ip 10.30.0.0 0.0.255.255 10.10.30.0 0.0.0.255
 permit ip 10.30.0.0 0.0.255.255 10.10.60.0 0.0.0.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.30.0.0 0.0.255.255 any
ip access-list extended ACL-BRANCH-VOICE-IN
 remark Voice: local site (not MGMT or transits), CME and voice subnets only
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 deny ip any 10.30.10.0 0.0.0.255
 deny ip any 10.30.0.0 0.0.0.255
 permit ip 10.30.50.0 0.0.0.255 10.30.0.0 0.0.255.255
 permit ip 10.30.50.0 0.0.0.255 10.10.50.0 0.0.0.255
 permit ip 10.30.50.0 0.0.0.255 10.20.50.0 0.0.0.255
 permit ip 10.30.50.0 0.0.0.255 10.40.50.0 0.0.0.255
 deny ip any any
ip access-list extended ACL-WIFI-GUEST-IN
 remark Guest Wi-Fi: HSRP, DHCP, own gateway, then internet only
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.30.70.0 0.0.0.255 10.30.70.0 0.0.0.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.30.70.0 0.0.0.255 any
interface Vlan20
 ip access-group ACL-BRANCH-DATA-IN in
interface Vlan50
 ip access-group ACL-BRANCH-VOICE-IN in
interface Vlan60
 ip access-group ACL-BRANCH-DATA-IN in
interface Vlan70
 ip access-group ACL-WIFI-GUEST-IN in
!
ip route 0.0.0.0 0.0.0.0 10.30.0.5
ip route 0.0.0.0 0.0.0.0 10.30.0.9 10
! Static routing only (ADR 0007). Each switch sends off-site traffic to the ASA over
! its own link; if that link fails, the floating route (AD 10) goes via the other
! switch over VLAN 900.
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
no ip http server
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! P0-16a fallback: tacacs server LON-SRV-AAA-01 / address ipv4 10.10.80.11 / key Lab-Tacacs-1
ip tacacs source-interface Vlan10
! If rejected: skip it and register this device's outgoing interface IP
! as the AAA client instead (listed in configs/servers/servers.md).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
logging trap informational
snmp-server community BSP-RO-Lab RO 99
!
end
! After pasting: copy running-config startup-config
