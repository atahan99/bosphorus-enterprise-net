!
! =====================================================================
! LON-EDGE-02  (ISR4331)  -  London
! Internet edge (standby): eBGP to ISP-B, NAT, CBAC firewall, DMZ gateway, VPN hub
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
! Before anything else (needs a reload):
!   license boot level securityk9  ->  end  ->  write memory  ->  reload
!
! ===== Phase 2: base ===============================================
!
hostname LON-EDGE-02
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
interface GigabitEthernet0/0/0
 description TO-ISP-B-Fa0/0
 no shutdown
interface GigabitEthernet0/0/1
 description TO-LON-CORE-02-Gi1/0/20
 no shutdown
interface GigabitEthernet0/0/2
 description TO-LON-DMZ-SW01-Gi0/2
 no shutdown
!
! ===== Phase 4: link to the core, OSPF area 0 ======================
!
interface Loopback0
 ip address 10.255.255.2 255.255.255.255
interface GigabitEthernet0/0/1
 ip address 10.255.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1000
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
! Cost 1000 (both ends, see LON-CORE-02 Gi1/0/20) keeps internal traffic to the DMZ
! on EDGE-01. It does not pick the internet exit: only EDGE-01 originates a default (B-25).
router ospf 1
 router-id 10.255.255.2
 auto-cost reference-bandwidth 10000
 passive-interface GigabitEthernet0/0/0
 passive-interface GigabitEthernet0/0/2
 passive-interface Loopback0
! B-41: not 'passive-interface default': PT can't name tunnels in 'no passive-interface'
! and loses them on reload, so the Phase 6 tunnels would stay passive.
 area 0 authentication message-digest
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.255.2 0.0.0.0 area 0
!
! ===== Phase 5: internet edge ======================================
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.6 255.255.255.252
 no cdp enable
!
! --- DMZ gateway (HSRP) ---
! P0-07a/b: PT has no HSRP authentication or tracking, so the DMZ gateway does not
! follow an ISP-A failure by itself (see ADR 0001, "Consequences").
interface GigabitEthernet0/0/2
 ip address 172.16.100.3 255.255.255.0
 standby version 2
 standby 100 ip 172.16.100.1
 standby 100 priority 100
 standby 100 preempt
!
! --- OSPF: DMZ subnet ---
! B-25: no 'default-information originate' here. PT load-shares two equal E2 defaults
! (it ignores the distance to the ASBR), which would send PAT traffic out of EDGE-02 and
! bring the replies back to EDGE-01's /25s. The LON cores keep a floating static default
! towards this edge instead (Phase 5 section of LON-CORE-01/02).
router ospf 1
 network 172.16.100.0 0.0.0.255 area 0
!
! --- BGP (AS 65100), eBGP only ---
! P0-11b-g: PT has no iBGP, prefix-lists, route-maps (so no AS-path prepend), session
! passwords or default-originate. ISP-B sends 0.0.0.0/0 with a network statement.
! Inbound preference: this edge announces the whole /24 and EDGE-01 the two /25
! halves, so the internet prefers ISP-A by longest match and uses this /24 only
! when EDGE-01's /25s are withdrawn (ADR 0001).
ip route 203.0.113.0 255.255.255.0 Null0
router bgp 65100
 bgp router-id 10.255.255.2
 bgp log-neighbor-changes
 network 203.0.113.0 mask 255.255.255.0
 neighbor 198.51.100.5 remote-as 65002
!
! --- NAT ---
ip access-list extended ACL-NAT
 remark Never translate traffic between internal sites
 deny ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 permit ip 10.0.0.0 0.255.255.255 any
ip nat pool PAT-POOL 203.0.113.2 203.0.113.2 netmask 255.255.255.0
ip nat inside source list ACL-NAT pool PAT-POOL overload
ip nat inside source static 172.16.100.10 203.0.113.10
ip nat inside source static 172.16.100.53 203.0.113.53
interface GigabitEthernet0/0/0
 ip nat outside
interface GigabitEthernet0/0/1
 ip nat inside
interface GigabitEthernet0/0/2
 ip nat inside
!
! --- Stateful firewall: CBAC + ACLs (ADR 0015) ---
! B-50: this edge first ran a zone-based firewall. PT can't put the Phase 6 GRE tunnels
! in a zone (B-40), and ZBF drops traffic between a zone member and a non-member, so all
! branch <-> London traffic was dropped. The same policy is expressed with CBAC and ACLs:
!   Gi0/0/0 (ISP):  inspect outbound; inbound only BGP, branch VPN peers, published services
!   Gi0/0/2 (DMZ):  inside and internet -> published services; DMZ -> replies and web/DNS out
!   Gi0/0/1 (core) and the tunnels: not filtered (the old INSIDE zone)
ip inspect name CBAC-OUT tcp
ip inspect name CBAC-OUT udp
ip inspect name CBAC-OUT icmp
ip access-list extended ACL-OUTSIDE-IN
 remark BGP, branch VPN peers and published DMZ services; replies are opened by CBAC
 permit tcp host 198.51.100.5 host 198.51.100.6 eq 179
 permit tcp host 198.51.100.5 eq 179 host 198.51.100.6
 permit udp host 198.51.100.10 host 198.51.100.6 eq isakmp
 permit udp host 198.51.100.14 host 198.51.100.6 eq isakmp
 permit esp host 198.51.100.10 host 198.51.100.6
 permit esp host 198.51.100.14 host 198.51.100.6
 permit gre host 198.51.100.10 host 198.51.100.6
 permit gre host 198.51.100.14 host 198.51.100.6
 permit tcp any host 203.0.113.10 eq www
 permit tcp any host 203.0.113.10 eq 443
 permit udp any host 203.0.113.53 eq domain
 permit icmp any host 203.0.113.10 echo
 permit icmp any any unreachable
 deny ip any any
! PT rejects the 'bgp' port keyword; 179 is used. The inbound ACL is checked before NAT,
! so the published services are matched on their public addresses.
ip access-list extended ACL-DMZ-IN
 remark From the DMZ: HSRP, replies to inside (stateless, ADR 0011), servers to the internet
 permit udp 172.16.100.0 0.0.0.255 host 224.0.0.102 eq 1985
 permit tcp host 172.16.100.10 eq www 10.0.0.0 0.255.255.255 established
 permit tcp host 172.16.100.10 eq 443 10.0.0.0 0.255.255.255 established
 permit udp host 172.16.100.53 eq domain 10.0.0.0 0.255.255.255
 permit tcp host 172.16.100.4 eq 22 10.10.10.0 0.0.0.255 established
 permit icmp 172.16.100.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 deny ip any 10.0.0.0 0.255.255.255
 permit tcp 172.16.100.0 0.0.0.255 any eq www
 permit tcp 172.16.100.0 0.0.0.255 any eq 443
 permit udp 172.16.100.0 0.0.0.255 any eq domain
 permit icmp 172.16.100.0 0.0.0.255 any
 deny ip any any
ip access-list extended ACL-TO-DMZ
 remark Into the DMZ: inside -> published services and switch SSH; internet -> published services; replies to DMZ sessions
 permit tcp 10.0.0.0 0.255.255.255 host 172.16.100.10 eq www
 permit tcp 10.0.0.0 0.255.255.255 host 172.16.100.10 eq 443
 permit udp 10.0.0.0 0.255.255.255 host 172.16.100.53 eq domain
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.100.4 eq 22
 permit icmp 10.10.10.0 0.0.0.255 172.16.100.0 0.0.0.255 echo
 deny ip 10.0.0.0 0.255.255.255 any
 permit tcp any host 172.16.100.10 eq www
 permit tcp any host 172.16.100.10 eq 443
 permit udp any host 172.16.100.53 eq domain
 permit icmp any host 172.16.100.10 echo
 permit tcp any 172.16.100.0 0.0.0.255 established
 permit udp any eq domain 172.16.100.0 0.0.0.255
 permit icmp any 172.16.100.0 0.0.0.255 echo-reply
 deny ip any any
interface GigabitEthernet0/0/0
 ip inspect CBAC-OUT out
 ip access-group ACL-OUTSIDE-IN in
interface GigabitEthernet0/0/2
 ip inspect CBAC-OUT out
 ip access-group ACL-DMZ-IN in
 ip access-group ACL-TO-DMZ out
!
! ===== Phase 6: VPN hub ============================================
!
! GRE over IPsec to both branches (IST-RTR-01, CHI-RTR-01). OSPF runs inside the tunnels:
! area 1 = Istanbul, area 2 = Chicago. London's 10.10.0.0/16 is summarised towards the
! branches; the branches are not summarised into area 0 (B-48: with two branch areas on
! one ABR, PT generates only one of the two ranges, differently on every load). EDGE-01 is the
! primary path: EDGE-02's core link costs 1000, so both directions prefer EDGE-01.
crypto isakmp policy 10
 encryption aes 256
 hash sha
 authentication pre-share
 group 5
 lifetime 86400
! P0-14a/b: PT supports only SHA-1 and DH group 5 for IKE. Must match both branch routers.
crypto isakmp key Lab-Ike-1 address 198.51.100.10
crypto isakmp key Lab-Ike-2 address 198.51.100.14
crypto ipsec transform-set TS-GRE-IST esp-aes 256 esp-sha-hmac
crypto ipsec transform-set TS-GRE-CHI esp-aes 256 esp-sha-hmac
! P0-14c/d: PT supports only esp-sha-hmac and tunnel mode. Must match the branch routers.
access-list 120 remark GRE to IST-RTR-01 is encrypted
access-list 120 permit gre host 198.51.100.6 host 198.51.100.10
access-list 140 remark GRE to CHI-RTR-01 is encrypted
access-list 140 permit gre host 198.51.100.6 host 198.51.100.14
crypto map CM-WAN 10 ipsec-isakmp
 description IST-RTR-01 GRE
 set peer 198.51.100.10
 set transform-set TS-GRE-IST
 match address 120
crypto map CM-WAN 20 ipsec-isakmp
 description CHI-RTR-01 GRE
 set peer 198.51.100.14
 set transform-set TS-GRE-CHI
 match address 140
interface GigabitEthernet0/0/0
 crypto map CM-WAN
!
! B-40: ISR4331 tunnels take only 'ip address' and 'tunnel ...' (no description, ip mtu,
! ip ospf ..., zone-member); area MD5 still forms over them.
interface Tunnel1
 ip address 10.255.1.5 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 198.51.100.10
interface Tunnel3
 ip address 10.255.1.13 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 198.51.100.14
router ospf 1
 area 1 authentication message-digest
 area 2 authentication message-digest
 area 0 range 10.10.0.0 255.255.0.0
 network 10.255.1.4 0.0.0.3 area 1
 network 10.255.1.12 0.0.0.3 area 2
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
no ip http server
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! B-01: PT has no 'ip tacacs source-interface'; the AAA client registered on
! LON-SRV-AAA-01 is this device's outgoing interface IP (configs/servers/servers.md).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 4
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
logging trap informational
snmp-server community BSP-RO-Lab RO
! P0-16d: PT rejects an ACL on the community; ACL 99 still limits VTY access.
!
! ===== Phase 8: QoS ================================================
!
ip access-list extended ACL-QOS-VOICE
 remark RTP from phones at every site
 permit udp 10.10.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.20.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.30.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.40.50.0 0.0.0.255 any range 16384 32767
ip access-list extended ACL-QOS-SIGNALING
 remark SCCP between branch phones and CME
 permit tcp 10.20.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.20.50.0 0.0.0.255
 permit tcp 10.30.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.30.50.0 0.0.0.255
 permit tcp 10.40.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.40.50.0 0.0.0.255
ip access-list extended ACL-QOS-CRITICAL
 remark Branch users <-> London servers
 permit ip 10.20.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.20.0.0 0.0.255.255
 permit ip 10.40.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.40.0.0 0.0.255.255
 permit ip 10.30.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.30.0.0 0.0.255.255
ip access-list extended ACL-QOS-SCAVENGER
 remark Guest Wi-Fi at every site
 permit ip 10.10.70.0 0.0.0.255 any
 permit ip 10.20.70.0 0.0.0.255 any
 permit ip 10.30.70.0 0.0.0.255 any
 permit ip 10.40.70.0 0.0.0.255 any
!
class-map match-any CM-MARK-VOICE
 match access-group name ACL-QOS-VOICE
class-map match-any CM-MARK-SIGNALING
 match access-group name ACL-QOS-SIGNALING
class-map match-any CM-MARK-CRITICAL
 match access-group name ACL-QOS-CRITICAL
class-map match-any CM-MARK-SCAVENGER
 match access-group name ACL-QOS-SCAVENGER
policy-map PM-MARK-IN
 class CM-MARK-VOICE
  set ip dscp ef
 class CM-MARK-SIGNALING
  set ip dscp cs3
 class CM-MARK-CRITICAL
  set ip dscp af31
 class CM-MARK-SCAVENGER
  set ip dscp cs1
!
class-map match-any CM-VOICE
 match ip dscp ef
class-map match-any CM-SIGNALING
 match ip dscp cs3
class-map match-any CM-CRITICAL
 match ip dscp af31
class-map match-any CM-SCAVENGER
 match ip dscp cs1
policy-map PM-WAN-OUT
 class CM-VOICE
  priority percent 10
 class CM-SIGNALING
  bandwidth percent 5
 class CM-CRITICAL
  bandwidth percent 20
 class CM-SCAVENGER
  bandwidth percent 1
 class class-default
  fair-queue
interface GigabitEthernet0/0/1
 service-policy input PM-MARK-IN
interface GigabitEthernet0/0/0
 service-policy output PM-WAN-OUT
!
end
! After pasting: copy running-config startup-config
