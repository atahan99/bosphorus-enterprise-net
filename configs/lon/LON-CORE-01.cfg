!
! =====================================================================
! LON-CORE-01  (3650-24PS)  -  London
! Collapsed core / distribution, L3 gateway (HSRP), OSPF area 0
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Lines tagged "P0-xx" depend on a Phase 0 result: if the command above
! the tag is rejected, use the fallback given in the tag instead.
! =====================================================================
!
!
! ===== Phase 2: base ===============================================
!
hostname LON-CORE-01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
!
! ===== Phase 3: switching ==========================================
!
vtp mode transparent
vtp domain BOSPHORUS
spanning-tree mode rapid-pvst
spanning-tree vlan 10,30,60,70,900,999 priority 24576
spanning-tree vlan 20,40,50,80 priority 28672
!
vlan 10
 name MGMT
vlan 20
 name ENG
vlan 30
 name SALES
vlan 40
 name FIN-HR
vlan 50
 name VOICE
vlan 60
 name WIFI-CORP
vlan 70
 name WIFI-GUEST
vlan 80
 name SERVERS
vlan 900
 name TRANSIT
vlan 998
 name PARKING
vlan 999
 name NATIVE-UNUSED
!
! --- Po1: LACP bundle to the other core (all VLANs + routed transit VLAN 900) ---
interface range GigabitEthernet1/0/23 - 24
 description TO-LON-CORE-02-Po1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,900,999
 channel-group 1 mode active
 no shutdown
! P0: if 'switchport trunk encapsulation dot1q' is rejected, ignore it (3650 is dot1q-only).
interface Port-channel1
 description TO-LON-CORE-02-Po1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,900,999
 no shutdown
!
! --- Downlinks to access switches: root guard stops any access switch becoming root ---
interface GigabitEthernet1/0/1
 description TO-LON-ACC-01-Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,999
 spanning-tree guard root
 no shutdown
interface GigabitEthernet1/0/2
 description TO-LON-ACC-02-Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,999
 spanning-tree guard root
 no shutdown
interface GigabitEthernet1/0/3
 description TO-LON-ACC-03-Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,50,999
 spanning-tree guard root
 no shutdown
interface GigabitEthernet1/0/4
 description TO-LON-ACC-04-Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,40,50,999
 spanning-tree guard root
 no shutdown
interface GigabitEthernet1/0/5
 description TO-LON-SRV-SW01-Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,80,999
 spanning-tree guard root
 no shutdown
!
! --- WLC uplink: management (VLAN 10) and the two WLAN VLANs ---
interface GigabitEthernet1/0/10
 description TO-LON-WLC-01-Gi1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,60,70,999
 no shutdown
! If the WLC can't tag its management interface, use:
!   switchport trunk native vlan 10  (and leave VLAN 10 untagged on the WLC)
!
! --- Unused ports: parked and shut ---
interface range GigabitEthernet1/0/6 - 9, GigabitEthernet1/0/11 - 19, GigabitEthernet1/0/22
 switchport mode access
 switchport access vlan 998
 shutdown
interface range GigabitEthernet1/1/1 - 4
 shutdown
interface Vlan1
 shutdown
!
! ===== Phase 4: routing, HSRP, DHCP relay ==========================
!
ip routing
!
interface Loopback0
 ip address 10.255.255.3 255.255.255.255
interface GigabitEthernet1/0/20
 description TO-LON-EDGE-01-Gi0/0/1
 no switchport
 ip address 10.255.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
 no shutdown
interface GigabitEthernet1/0/21
 description TO-LON-WAN-01-Gi0/0/1
 no switchport
 ip address 10.255.0.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
 no shutdown
interface Vlan900
 description TRANSIT-TO-LON-CORE-02
 ip address 10.255.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
 no shutdown
!
! HSRP tracks the uplink to the edge router: if it fails, priority drops by 20
! and the other core takes over the gateways this switch was active for.
track 1 interface GigabitEthernet1/0/20 line-protocol
! P0-07b fallback: if 'track' is rejected, remove every 'standby N track 1 decrement 20'
! line below and use 'standby N track GigabitEthernet1/0/20 20' instead.
!
interface Vlan10
 description MGMT
 ip address 10.10.10.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 authentication md5 key-string Lab-Hsrp-1
 standby 10 track 1 decrement 20
 no shutdown
interface Vlan20
 description ENG
 ip address 10.10.20.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 standby 20 preempt
 standby 20 authentication md5 key-string Lab-Hsrp-1
 standby 20 track 1 decrement 20
 no shutdown
interface Vlan30
 description SALES
 ip address 10.10.30.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 110
 standby 30 preempt
 standby 30 authentication md5 key-string Lab-Hsrp-1
 standby 30 track 1 decrement 20
 no shutdown
interface Vlan40
 description FIN-HR
 ip address 10.10.40.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 100
 standby 40 preempt
 standby 40 authentication md5 key-string Lab-Hsrp-1
 standby 40 track 1 decrement 20
 no shutdown
interface Vlan50
 description VOICE
 ip address 10.10.50.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 50 ip 10.10.50.1
 standby 50 priority 100
 standby 50 preempt
 standby 50 authentication md5 key-string Lab-Hsrp-1
 standby 50 track 1 decrement 20
 no shutdown
interface Vlan60
 description WIFI-CORP
 ip address 10.10.60.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 60 ip 10.10.60.1
 standby 60 priority 110
 standby 60 preempt
 standby 60 authentication md5 key-string Lab-Hsrp-1
 standby 60 track 1 decrement 20
 no shutdown
interface Vlan70
 description WIFI-GUEST
 ip address 10.10.70.2 255.255.255.0
 ip helper-address 10.10.80.10
 standby version 2
 standby 70 ip 10.10.70.1
 standby 70 priority 110
 standby 70 preempt
 standby 70 authentication md5 key-string Lab-Hsrp-1
 standby 70 track 1 decrement 20
 no shutdown
interface Vlan80
 description SERVERS
 ip address 10.10.80.2 255.255.255.0
 standby version 2
 standby 80 ip 10.10.80.1
 standby 80 priority 100
 standby 80 preempt
 standby 80 authentication md5 key-string Lab-Hsrp-1
 standby 80 track 1 decrement 20
 no shutdown
!
router ospf 1
 router-id 10.255.255.3
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet1/0/20
 no passive-interface GigabitEthernet1/0/21
 no passive-interface Vlan900
 area 0 authentication message-digest
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.255 area 0
 network 10.255.255.3 0.0.0.0 area 0
!
! ===== Phase 7: inter-VLAN policy ==================================
!
! MGMT (VLAN 10) and SERVERS (VLAN 80) are not filtered inbound.
ip access-list extended ACL-ENG-IN
 remark --- control plane and infrastructure ---
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.10.20.0 0.0.0.255 10.10.20.0 0.0.0.255
 remark --- return traffic for sessions opened from MGMT ---
 permit tcp 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 remark --- servers: DNS, intranet, mail, ping ---
 permit udp 10.10.20.0 0.0.0.255 host 10.10.80.10 eq domain
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.80.13 eq www
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.80.13 eq 443
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.80.13 eq smtp
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.80.13 eq pop3
 permit icmp 10.10.20.0 0.0.0.255 10.10.80.0 0.0.0.255 echo
 remark --- public website in the DMZ (internal DNS resolves www to 172.16.100.10) ---
 permit tcp 10.10.20.0 0.0.0.255 host 172.16.100.10 eq www
 permit tcp 10.10.20.0 0.0.0.255 host 172.16.100.10 eq 443
 remark --- peer user VLANs, branch user and branch corporate Wi-Fi subnets ---
 permit ip 10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.10.60.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.20.20.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.30.20.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.40.20.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.20.60.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.30.60.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 10.40.60.0 0.0.0.255
 remark --- all other internal and private space denied, internet allowed ---
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.10.20.0 0.0.0.255 any
!
ip access-list extended ACL-SALES-IN
 remark --- control plane and infrastructure ---
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.10.30.0 0.0.0.255 10.10.30.0 0.0.0.255
 remark --- return traffic for sessions opened from MGMT ---
 permit tcp 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 remark --- servers: DNS, intranet, mail, ping ---
 permit udp 10.10.30.0 0.0.0.255 host 10.10.80.10 eq domain
 permit tcp 10.10.30.0 0.0.0.255 host 10.10.80.13 eq www
 permit tcp 10.10.30.0 0.0.0.255 host 10.10.80.13 eq 443
 permit tcp 10.10.30.0 0.0.0.255 host 10.10.80.13 eq smtp
 permit tcp 10.10.30.0 0.0.0.255 host 10.10.80.13 eq pop3
 permit icmp 10.10.30.0 0.0.0.255 10.10.80.0 0.0.0.255 echo
 remark --- public website in the DMZ (internal DNS resolves www to 172.16.100.10) ---
 permit tcp 10.10.30.0 0.0.0.255 host 172.16.100.10 eq www
 permit tcp 10.10.30.0 0.0.0.255 host 172.16.100.10 eq 443
 remark --- peer user VLANs, branch user and branch corporate Wi-Fi subnets ---
 permit ip 10.10.30.0 0.0.0.255 10.10.20.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.10.60.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.20.20.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.30.20.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.40.20.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.20.60.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.30.60.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 10.40.60.0 0.0.0.255
 remark --- all other internal and private space denied, internet allowed ---
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.10.30.0 0.0.0.255 any
!
ip access-list extended ACL-WIFI-CORP-IN
 remark --- control plane and infrastructure ---
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.10.60.0 0.0.0.255 10.10.60.0 0.0.0.255
 remark --- return traffic for sessions opened from MGMT ---
 permit tcp 10.10.60.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.10.60.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 remark --- servers: DNS, intranet, mail, ping ---
 permit udp 10.10.60.0 0.0.0.255 host 10.10.80.10 eq domain
 permit tcp 10.10.60.0 0.0.0.255 host 10.10.80.13 eq www
 permit tcp 10.10.60.0 0.0.0.255 host 10.10.80.13 eq 443
 permit tcp 10.10.60.0 0.0.0.255 host 10.10.80.13 eq smtp
 permit tcp 10.10.60.0 0.0.0.255 host 10.10.80.13 eq pop3
 permit icmp 10.10.60.0 0.0.0.255 10.10.80.0 0.0.0.255 echo
 remark --- public website in the DMZ (internal DNS resolves www to 172.16.100.10) ---
 permit tcp 10.10.60.0 0.0.0.255 host 172.16.100.10 eq www
 permit tcp 10.10.60.0 0.0.0.255 host 172.16.100.10 eq 443
 remark --- peer user VLANs, branch user and branch corporate Wi-Fi subnets ---
 permit ip 10.10.60.0 0.0.0.255 10.10.20.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.10.30.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.20.20.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.30.20.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.40.20.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.20.60.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.30.60.0 0.0.0.255
 permit ip 10.10.60.0 0.0.0.255 10.40.60.0 0.0.0.255
 remark --- all other internal and private space denied, internet allowed ---
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.10.60.0 0.0.0.255 any
!
ip access-list extended ACL-FIN-IN
 remark --- control plane and infrastructure ---
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.10.40.0 0.0.0.255 10.10.40.0 0.0.0.255
 remark --- return traffic for sessions opened from MGMT ---
 permit tcp 10.10.40.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.10.40.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 remark --- full access to the server VLAN ---
 permit ip 10.10.40.0 0.0.0.255 10.10.80.0 0.0.0.255
 remark --- public website in the DMZ (internal DNS resolves www to 172.16.100.10) ---
 permit tcp 10.10.40.0 0.0.0.255 host 172.16.100.10 eq www
 permit tcp 10.10.40.0 0.0.0.255 host 172.16.100.10 eq 443
 remark --- all other internal and private space denied, internet allowed ---
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.10.40.0 0.0.0.255 any
!
ip access-list extended ACL-VOICE-IN
 remark --- control plane and infrastructure ---
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.10.50.0 0.0.0.255 10.10.50.0 0.0.0.255
 remark --- return traffic for sessions opened from MGMT ---
 permit tcp 10.10.50.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.10.50.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 remark --- branch phones: SCCP to CME, RTP between phones ---
 permit ip 10.10.50.0 0.0.0.255 10.20.50.0 0.0.0.255
 permit ip 10.10.50.0 0.0.0.255 10.30.50.0 0.0.0.255
 permit ip 10.10.50.0 0.0.0.255 10.40.50.0 0.0.0.255
 remark --- CME router management: TACACS+, syslog, NTP, TFTP backups ---
 permit tcp host 10.10.50.10 host 10.10.80.11 eq 49
 permit udp host 10.10.50.10 host 10.10.80.12 eq 514
 permit udp host 10.10.50.10 host 10.10.80.12 eq 123
 permit udp host 10.10.50.10 host 10.10.80.12 eq 69
 remark --- no internet, no other internal access ---
 deny ip any any
!
ip access-list extended ACL-WIFI-GUEST-IN
 remark --- control plane, DHCP, own gateway ---
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.10.70.0 0.0.0.255 10.10.70.0 0.0.0.255
 remark --- internet only ---
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.10.70.0 0.0.0.255 any
!
interface Vlan20
 ip access-group ACL-ENG-IN in
interface Vlan30
 ip access-group ACL-SALES-IN in
interface Vlan40
 ip access-group ACL-FIN-IN in
interface Vlan50
 ip access-group ACL-VOICE-IN in
interface Vlan60
 ip access-group ACL-WIFI-CORP-IN in
interface Vlan70
 ip access-group ACL-WIFI-GUEST-IN in
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
no ip http server
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! P0-16a fallback: tacacs server LON-SRV-AAA-01 / address ipv4 10.10.80.11 / key Lab-Tacacs-1
ip tacacs source-interface Loopback0
! If rejected: skip it and register this device's outgoing interface IP
! as the AAA client instead (listed in configs/servers/servers.md).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
logging trap informational
snmp-server community BSP-RO-Lab RO 99
!
end
! After pasting: copy running-config startup-config
