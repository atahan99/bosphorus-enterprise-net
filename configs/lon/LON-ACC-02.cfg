!
! =====================================================================
! LON-ACC-02  (2960-24TT)  -  London
! Access switch, floor 1 (2 of 2): 20 ENG desks, AP-02
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
!
! ===== Phase 2: base ===============================================
!
hostname LON-ACC-02
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
!
! ===== Phase 3: switching ==========================================
!
vtp mode transparent
vtp domain BOSPHORUS
spanning-tree mode rapid-pvst
vlan 10
 name MGMT
vlan 20
 name ENG
vlan 50
 name VOICE
vlan 998
 name PARKING
vlan 999
 name NATIVE-UNUSED
! --- Uplinks (P0-02b: PT has no loop guard) ---
interface GigabitEthernet0/1
 description TO-LON-CORE-01-Gi1/0/2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,999
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
interface GigabitEthernet0/2
 description TO-LON-CORE-02-Gi1/0/2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,999
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
! --- Access ports ---
interface range FastEthernet0/1 - 20
 description DESK-ENG
 switchport mode access
 switchport nonegotiate
 switchport access vlan 20
 switchport voice vlan 50
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/1
 description DESK-ENG (LON-PC-ENG-03)
interface FastEthernet0/23
 description LON-AP-02
 switchport mode access
 switchport nonegotiate
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
! --- Unused ports ---
interface range FastEthernet0/21 - 22, FastEthernet0/24
 switchport mode access
 switchport access vlan 998
 shutdown
interface Vlan1
 shutdown
interface Vlan10
 description MGMT
 ip address 10.10.10.12 255.255.255.0
 no shutdown
ip default-gateway 10.10.10.1
!
! ===== Phase 3: Layer 2 security ===================================
!
ip dhcp snooping vlan 10,20,50
ip dhcp snooping
no ip dhcp snooping information option
! Without the line above the switch inserts option 82 and the core's DHCP relay
! drops the requests (giaddr 0 + option 82 from an untrusted source).
ip arp inspection vlan 20,50
! P0-05a: PT accepts DAI (2960 needs IOS 15, B-24) but does not drop; kept as a documented control.
! P0-03: PT has no errdisable recovery; recover a port with shutdown / no shutdown.
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
no ip http server
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
logging trap informational
snmp-server community BSP-RO-Lab RO
! P0-16d: PT rejects an ACL on the community; ACL 99 still limits VTY access.
!
end
! After pasting: copy running-config startup-config
