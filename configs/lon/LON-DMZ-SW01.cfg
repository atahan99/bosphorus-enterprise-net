!
! =====================================================================
! LON-DMZ-SW01  (2960-24TT)  -  London DMZ
! DMZ segment between the edge routers and the public servers
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
!
! ===== Phase 2: base ===============================================
!
hostname LON-DMZ-SW01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
!
! ===== Phase 3: switching ==========================================
!
vtp mode transparent
vtp domain BOSPHORUS
spanning-tree mode rapid-pvst
vlan 100
 name DMZ
vlan 998
 name PARKING
! Router-facing ports have no port security: the HSRP virtual MAC moves
! between these two ports on failover, which port security would block.
interface range GigabitEthernet0/1 - 2
 switchport mode access
 switchport nonegotiate
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface GigabitEthernet0/1
 description TO-LON-EDGE-01-Gi0/0/2
interface GigabitEthernet0/2
 description TO-LON-EDGE-02-Gi0/0/2
interface FastEthernet0/1
 description LON-DMZ-WEB-01
 switchport mode access
 switchport nonegotiate
 switchport access vlan 100
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface FastEthernet0/2
 description LON-DMZ-DNS-01
 switchport mode access
 switchport nonegotiate
 switchport access vlan 100
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/3 - 24
 switchport mode access
 switchport access vlan 998
 shutdown
interface Vlan1
 shutdown
interface Vlan100
 description DMZ-MGMT
 ip address 172.16.100.4 255.255.255.0
 no shutdown
ip default-gateway 172.16.100.1
!
! ===== Phase 7: management plane ===================================
!
! The edge firewall (ACL-DMZ-IN) blocks DMZ -> inside, so this switch can't reach
! TACACS+, syslog or NTP. It uses local authentication only and is managed
! over SSH from the MGMT VLAN (inside -> DMZ is allowed for SSH to .4).
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
no ip http server
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
aaa authentication login default local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
end
! After pasting: copy running-config startup-config
