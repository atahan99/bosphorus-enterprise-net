!
! =====================================================================
! LON-EDGE-01  (ISR4331)  -  London
! Internet edge (primary): eBGP to ISP-A, iBGP, NAT, zone-based firewall, DMZ gateway, VPN hub
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Lines tagged "P0-xx" depend on a Phase 0 result: if the command above
! the tag is rejected, use the fallback given in the tag instead.
! =====================================================================
!
! Before anything else (needs a reload):
!   license boot level securityk9  ->  end  ->  write memory  ->  reload
!
! ===== Phase 2: base ===============================================
!
hostname LON-EDGE-01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
interface GigabitEthernet0/0/0
 description TO-ISP-A-Fa0/0
 no shutdown
interface GigabitEthernet0/0/1
 description TO-LON-CORE-01-Gi1/0/20
 no shutdown
interface GigabitEthernet0/0/2
 description TO-LON-DMZ-SW01-Gi0/1
 no shutdown
!
! ===== Phase 4: link to the core, OSPF area 0 ======================
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
interface GigabitEthernet0/0/1
 ip address 10.255.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
router ospf 1
 router-id 10.255.255.1
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 area 0 authentication message-digest
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
! ===== Phase 5: internet edge ======================================
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.2 255.255.255.252
 no cdp enable
!
! --- DMZ gateway (HSRP, tracks the ISP link) ---
track 2 interface GigabitEthernet0/0/0 line-protocol
interface GigabitEthernet0/0/2
 ip address 172.16.100.2 255.255.255.0
 standby version 2
 standby 100 ip 172.16.100.1
 standby 100 priority 110
 standby 100 preempt
 standby 100 authentication md5 key-string Lab-Hsrp-1
 standby 100 track 2 decrement 20
! P0-07b fallback: standby 100 track GigabitEthernet0/0/0 20
!
! --- OSPF: DMZ subnet and default route into the enterprise ---
router ospf 1
 network 172.16.100.0 0.0.0.255 area 0
 default-information originate metric 10 metric-type 2
!
! --- BGP (AS 65100) ---
ip route 203.0.113.0 255.255.255.0 Null0
ip prefix-list PL-BGP-OUT seq 5 permit 203.0.113.0/24
ip prefix-list PL-BGP-IN seq 5 permit 0.0.0.0/0
ip prefix-list PL-BGP-IN seq 10 permit 192.0.2.0/24
! Do not accept the partner edge's default over iBGP. Each edge must withdraw
! its OSPF default when its own ISP default disappears, preserving NAT symmetry.
ip prefix-list PL-IBGP-IN seq 5 deny 0.0.0.0/0
ip prefix-list PL-IBGP-IN seq 10 permit 192.0.2.0/24

router bgp 65100
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 network 203.0.113.0 mask 255.255.255.0
 neighbor 198.51.100.1 remote-as 65001
 neighbor 198.51.100.1 description ISP-A
 neighbor 198.51.100.1 password Lab-Bgp-1
 neighbor 198.51.100.1 prefix-list PL-BGP-IN in
 neighbor 198.51.100.1 prefix-list PL-BGP-OUT out
 neighbor 10.255.255.2 remote-as 65100
 neighbor 10.255.255.2 description LON-EDGE-02-iBGP
 neighbor 10.255.255.2 update-source Loopback0
 neighbor 10.255.255.2 next-hop-self
 neighbor 10.255.255.2 prefix-list PL-IBGP-IN in
! P0-11f: if 'password' is rejected, remove it here and on ISP-A.
!
! --- NAT ---
ip access-list extended ACL-NAT
 remark Never translate traffic between internal sites
 deny ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 permit ip 10.0.0.0 0.255.255.255 any
ip nat pool PAT-POOL 203.0.113.1 203.0.113.1 netmask 255.255.255.0
ip nat inside source list ACL-NAT pool PAT-POOL overload
ip nat inside source static 172.16.100.10 203.0.113.10
ip nat inside source static 172.16.100.53 203.0.113.53
! P0-15a fallback: if the named ACL is rejected for NAT, create numbered ACL 101
! with the same deny and permit lines and use 'ip nat inside source list 101 pool PAT-POOL overload'.
interface GigabitEthernet0/0/0
 ip nat outside
interface GigabitEthernet0/0/1
 ip nat inside
interface GigabitEthernet0/0/2
 ip nat inside
!
! --- Zone-based firewall ---
ip access-list extended ACL-ZBF-IN-DMZ
 remark Inside -> DMZ: published services and DMZ switch management
 permit tcp 10.0.0.0 0.255.255.255 host 172.16.100.10 eq www
 permit tcp 10.0.0.0 0.255.255.255 host 172.16.100.10 eq 443
 permit udp 10.0.0.0 0.255.255.255 host 172.16.100.53 eq domain
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.100.4 eq 22
 permit icmp 10.10.10.0 0.0.0.255 172.16.100.0 0.0.0.255 echo
ip access-list extended ACL-ZBF-DMZ-IN
 remark DMZ -> inside: replies to the flows above only (stateless, see ADR 0011)
 permit tcp host 172.16.100.10 eq www 10.0.0.0 0.255.255.255 established
 permit tcp host 172.16.100.10 eq 443 10.0.0.0 0.255.255.255 established
 permit udp host 172.16.100.53 eq domain 10.0.0.0 0.255.255.255
 permit tcp host 172.16.100.4 eq 22 10.10.10.0 0.0.0.255 established
 permit icmp 172.16.100.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
ip access-list extended ACL-ZBF-OUT-DMZ
 remark Internet -> published DMZ services (real IPs: ZBF sees traffic after NAT)
 permit tcp any host 172.16.100.10 eq www
 permit tcp any host 172.16.100.10 eq 443
 permit udp any host 172.16.100.53 eq domain
 permit icmp any host 172.16.100.10 echo
!
class-map type inspect match-any CM-ZBF-WEB-PROTOCOLS
 match protocol http
 match protocol https
 match protocol dns
 match protocol icmp
class-map type inspect match-any CM-ZBF-IN-DMZ
 match access-group name ACL-ZBF-IN-DMZ
class-map type inspect match-any CM-ZBF-DMZ-IN
 match access-group name ACL-ZBF-DMZ-IN
class-map type inspect match-any CM-ZBF-OUT-DMZ
 match access-group name ACL-ZBF-OUT-DMZ
! Chicago VPN traffic is passed statelessly in both directions (trusted site).
ip access-list extended ACL-ZBF-VPN-CHI-OUT
 permit ip 10.0.0.0 0.255.255.255 10.30.0.0 0.0.255.255
ip access-list extended ACL-ZBF-VPN-CHI-IN
 permit ip 10.30.0.0 0.0.255.255 10.0.0.0 0.255.255.255
class-map type inspect match-any CM-ZBF-VPN-CHI-OUT
 match access-group name ACL-ZBF-VPN-CHI-OUT
class-map type inspect match-any CM-ZBF-VPN-CHI-IN
 match access-group name ACL-ZBF-VPN-CHI-IN
policy-map type inspect PM-ZBF-IN-OUT
 class type inspect CM-ZBF-VPN-CHI-OUT
  pass
 class type inspect CM-ZBF-WEB-PROTOCOLS
  inspect
 class class-default
  drop
policy-map type inspect PM-ZBF-OUT-IN
 class type inspect CM-ZBF-VPN-CHI-IN
  pass
 class class-default
  drop
policy-map type inspect PM-ZBF-IN-DMZ
 class type inspect CM-ZBF-IN-DMZ
  pass
 class class-default
  drop
policy-map type inspect PM-ZBF-DMZ-IN
 class type inspect CM-ZBF-DMZ-IN
  pass
 class class-default
  drop
policy-map type inspect PM-ZBF-OUT-DMZ
 class type inspect CM-ZBF-OUT-DMZ
  inspect
 class class-default
  drop
policy-map type inspect PM-ZBF-DMZ-OUT
 class type inspect CM-ZBF-WEB-PROTOCOLS
  inspect
 class class-default
  drop
!
zone security INSIDE
 description Core-facing link and VPN tunnels
zone security DMZ
 description Public servers
zone security OUTSIDE
 description ISP
zone-pair security ZP-IN-OUT source INSIDE destination OUTSIDE
 service-policy type inspect PM-ZBF-IN-OUT
zone-pair security ZP-IN-DMZ source INSIDE destination DMZ
 service-policy type inspect PM-ZBF-IN-DMZ
zone-pair security ZP-DMZ-IN source DMZ destination INSIDE
 service-policy type inspect PM-ZBF-DMZ-IN
zone-pair security ZP-OUT-DMZ source OUTSIDE destination DMZ
 service-policy type inspect PM-ZBF-OUT-DMZ
zone-pair security ZP-DMZ-OUT source DMZ destination OUTSIDE
 service-policy type inspect PM-ZBF-DMZ-OUT
! OUTSIDE -> INSIDE only passes decrypted Chicago VPN traffic; everything else is dropped.
zone-pair security ZP-OUT-IN source OUTSIDE destination INSIDE
 service-policy type inspect PM-ZBF-OUT-IN
interface GigabitEthernet0/0/0
 zone-member security OUTSIDE
interface GigabitEthernet0/0/1
 zone-member security INSIDE
interface GigabitEthernet0/0/2
 zone-member security DMZ
! The self zone is left at defaults so BGP, OSPF, IKE/ESP, GRE, HSRP and SSH to the router work.
!
! ===== Phase 6: VPN hub ============================================
!
! --- Istanbul: GRE over IPsec (primary tunnel), OSPF area 1 inside the tunnel ---
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
! P0-14a/b fallback: 'hash sha' and 'group 5' (then 'group 2'). Must match IST-RTR-01.
crypto isakmp key Lab-Ike-1 address 198.51.100.10
crypto ipsec transform-set TS-GRE-IST esp-aes 256 esp-sha256-hmac
 mode transport
! P0-14c/d fallback: 'esp-sha-hmac'; remove 'mode transport'. Must match IST-RTR-01.
access-list 110 remark GRE to IST-RTR-01 is encrypted
access-list 110 permit gre host 198.51.100.2 host 198.51.100.10
crypto map CM-WAN 10 ipsec-isakmp
 description IST-RTR-01 GRE
 set peer 198.51.100.10
 set transform-set TS-GRE-IST
 match address 110
!
! --- Chicago: policy-based IPsec to CHI-FW-01 (ASA), backup peer ---
crypto isakmp policy 20
 encryption aes 256
 hash sha
 authentication pre-share
 group 14
 lifetime 86400
! Must match 'crypto ikev1 policy 10' on CHI-FW-01. If the ASA rejects group 14,
! use group 5 (then 2) on both sides.
crypto isakmp key Lab-Ike-2 address 198.51.100.14
crypto ipsec transform-set TS-CHI esp-aes 256 esp-sha-hmac
access-list 130 remark London/branches <-> Chicago (mirror of CHI-FW-01 VPN-TO-LON)
access-list 130 permit ip 10.0.0.0 0.255.255.255 10.30.0.0 0.0.255.255
crypto map CM-WAN 20 ipsec-isakmp
 description CHI-FW-01
 set peer 198.51.100.14
 set transform-set TS-CHI
 match address 130
ip prefix-list PL-CHI seq 5 permit 10.30.0.0/16
ip route 10.30.0.0 255.255.0.0 198.51.100.1 250
! Backup: a floating static (AD 250). It only enters the routing table, and is only
! redistributed into OSPF, once EDGE-02's route to Chicago has been withdrawn.
route-map RM-STATIC-TO-OSPF permit 10
 match ip address prefix-list PL-CHI
 set metric 200
router ospf 1
 redistribute static subnets route-map RM-STATIC-TO-OSPF
interface GigabitEthernet0/0/0
 crypto map CM-WAN
!
interface Tunnel0
 description GRE-IPSEC-TO-IST-RTR-01 (primary)
 ip address 10.255.1.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
! If 'ip tcp adjust-mss' is rejected, skip it.
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
 tunnel source GigabitEthernet0/0/0
 tunnel destination 198.51.100.10
 zone-member security INSIDE
router ospf 1
 no passive-interface Tunnel0
 area 1 authentication message-digest
 area 0 range 10.10.0.0 255.255.0.0
 area 1 range 10.20.0.0 255.255.0.0
 network 10.255.1.0 0.0.0.3 area 1
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
no ip http server
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! P0-16a fallback: tacacs server LON-SRV-AAA-01 / address ipv4 10.10.80.11 / key Lab-Tacacs-1
ip tacacs source-interface Loopback0
! If rejected: skip it and register this device's outgoing interface IP
! as the AAA client instead (listed in configs/servers/servers.md).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 4
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
logging trap informational
snmp-server community BSP-RO-Lab RO 99
!
! ===== Phase 8: QoS ================================================
!
ip access-list extended ACL-QOS-VOICE
 remark RTP from phones at every site
 permit udp 10.10.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.20.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.30.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.40.50.0 0.0.0.255 any range 16384 32767
ip access-list extended ACL-QOS-SIGNALING
 remark SCCP between branch phones and CME
 permit tcp 10.20.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.20.50.0 0.0.0.255
 permit tcp 10.30.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.30.50.0 0.0.0.255
 permit tcp 10.40.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.40.50.0 0.0.0.255
ip access-list extended ACL-QOS-CRITICAL
 remark Branch users <-> London servers
 permit ip 10.20.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.20.0.0 0.0.255.255
 permit ip 10.40.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.40.0.0 0.0.255.255
 permit ip 10.30.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.30.0.0 0.0.255.255
ip access-list extended ACL-QOS-SCAVENGER
 remark Guest Wi-Fi at every site
 permit ip 10.10.70.0 0.0.0.255 any
 permit ip 10.20.70.0 0.0.0.255 any
 permit ip 10.30.70.0 0.0.0.255 any
 permit ip 10.40.70.0 0.0.0.255 any
!
class-map match-any CM-MARK-VOICE
 match access-group name ACL-QOS-VOICE
class-map match-any CM-MARK-SIGNALING
 match access-group name ACL-QOS-SIGNALING
class-map match-any CM-MARK-CRITICAL
 match access-group name ACL-QOS-CRITICAL
class-map match-any CM-MARK-SCAVENGER
 match access-group name ACL-QOS-SCAVENGER
policy-map PM-MARK-IN
 class CM-MARK-VOICE
  set ip dscp ef
 class CM-MARK-SIGNALING
  set ip dscp cs3
 class CM-MARK-CRITICAL
  set ip dscp af31
 class CM-MARK-SCAVENGER
  set ip dscp cs1
!
class-map match-any CM-VOICE
 match ip dscp ef
class-map match-any CM-SIGNALING
 match ip dscp cs3
class-map match-any CM-CRITICAL
 match ip dscp af31
class-map match-any CM-SCAVENGER
 match ip dscp cs1
policy-map PM-WAN-OUT
 class CM-VOICE
  priority percent 10
 class CM-SIGNALING
  bandwidth percent 5
 class CM-CRITICAL
  bandwidth percent 20
 class CM-SCAVENGER
  bandwidth percent 1
 class class-default
  fair-queue
! P0-17: if MQC is rejected on this model, skip this whole Phase 8 QoS
! section; the design is kept in configs/_design-only/ and docs/design-plan.md.
interface GigabitEthernet0/0/1
 service-policy input PM-MARK-IN
interface GigabitEthernet0/0/0
 service-policy output PM-WAN-OUT
!
end
! After pasting: copy running-config startup-config
