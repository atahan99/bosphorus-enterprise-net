!
! =====================================================================
! IST-SW-01  (3650-24PS)  -  Istanbul
! Branch switch 1 of 2: collapsed core/access, HSRP gateways, split-scope DHCP
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
! Physical tab: add AC-POWER-SUPPLY before powering on. The 3650-24PS supplies PoE,
! so phones and APs on this switch need no power adapter.
!
! ===== Phase 2: base ===============================================
!
hostname IST-SW-01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
!
! ===== Phase 6: switching ==========================================
!
vtp mode transparent
vtp domain BOSPHORUS
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,60,900 priority 24576
spanning-tree vlan 50,70 priority 28672
vlan 10
 name MGMT
vlan 20
 name USERS
vlan 50
 name VOICE
vlan 60
 name WIFI-CORP
vlan 70
 name WIFI-GUEST
vlan 900
 name TRANSIT
vlan 998
 name PARKING
vlan 999
 name NATIVE-UNUSED
! --- Po1: LACP bundle to the other switch of the pair ---
interface range GigabitEthernet1/0/23 - 24
 description TO-IST-SW-02-Po1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,60,70,900,999
 channel-group 1 mode active
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
! B-42: PT's 3650 rejects the snooping and DAI trust commands on Port-channel1, so they
! sit on the member ports.
! B-33: if Po1 stays (SD) with members (s) once both switches are configured, re-apply
! 'channel-group 1 mode active' on the members of BOTH switches (build guide, Phase 3).
interface Port-channel1
 description TO-IST-SW-02-Po1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,60,70,900,999
 no shutdown
! B-26: the 3650 is dot1q-only and rejects "switchport trunk encapsulation dot1q".
! --- Access ports ---
interface range GigabitEthernet1/0/1 - 15
 description DESK-USERS
 switchport mode access
 switchport nonegotiate
 switchport access vlan 20
 switchport voice vlan 50
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface GigabitEthernet1/0/1
 description DESK-USERS (IST-PC-01)
interface GigabitEthernet1/0/2
 description DESK-USERS (IST-PH-01)
interface GigabitEthernet1/0/21
 description IST-AP-01 (SSID BSP-CORP)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 60
 switchport port-security
 switchport port-security maximum 10
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ! Autonomous AP (AccessPoint-PT) bridging one SSID into this VLAN.
 ! maximum 10: the wireless clients' MACs are learned on this port.
 no shutdown
! --- Spare ports ---
interface range GigabitEthernet1/0/16 - 20
 switchport mode access
 switchport access vlan 998
 shutdown
interface range GigabitEthernet1/1/1 - 4
 shutdown
interface Vlan1
 shutdown
!
! ===== Phase 6: Layer 2 security ===================================
!
ip dhcp snooping vlan 20,50,60,70
ip dhcp snooping
no ip dhcp snooping information option
! Without the line above the switch inserts option 82 and the core's DHCP relay
! drops the requests (giaddr 0 + option 82 from an untrusted source).
ip arp inspection vlan 20,50,60,70
! P0-05a: PT accepts DAI (2960 needs IOS 15, B-24) but does not drop; kept as a documented control.
! P0-03: PT has no errdisable recovery; recover a port with shutdown / no shutdown.
! The DHCP servers are the two switches themselves; offers from the other
! switch arrive over Po1, which is trusted.
!
! ===== Phase 6: gateways, DHCP, routing ============================
!
ip routing
interface Loopback0
 ip address 10.255.255.12 255.255.255.255
interface GigabitEthernet1/0/22
 description TO-IST-RTR-01-Gi0/0/1
 no switchport
 ip address 10.20.0.14 255.255.255.252
 no shutdown
interface Vlan900
 description TRANSIT-TO-IST-SW-02
 ip address 10.20.0.9 255.255.255.252
 no shutdown
!
! HSRP: this switch is active for VLAN 10, 20, 60; the other switch for the rest.
! P0-07a/b: PT has no HSRP authentication or tracking. If a switch loses its
! uplink it keeps its gateways and forwards over VLAN 900 to the other switch.
interface Vlan10
 description MGMT
 ip address 10.20.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.20.10.1
 standby 10 priority 110
 standby 10 preempt
 no shutdown
interface Vlan20
 description USERS
 ip address 10.20.20.2 255.255.255.0
 standby version 2
 standby 20 ip 10.20.20.1
 standby 20 priority 110
 standby 20 preempt
 no shutdown
interface Vlan50
 description VOICE
 ip address 10.20.50.2 255.255.255.0
 standby version 2
 standby 50 ip 10.20.50.1
 standby 50 priority 100
 standby 50 preempt
 no shutdown
interface Vlan60
 description WIFI-CORP
 ip address 10.20.60.2 255.255.255.0
 standby version 2
 standby 60 ip 10.20.60.1
 standby 60 priority 110
 standby 60 preempt
 no shutdown
interface Vlan70
 description WIFI-GUEST
 ip address 10.20.70.2 255.255.255.0
 standby version 2
 standby 70 ip 10.20.70.1
 standby 70 priority 100
 standby 70 preempt
 no shutdown
!
ip dhcp excluded-address 10.20.20.1 10.20.20.99
ip dhcp excluded-address 10.20.20.176 10.20.20.255
ip dhcp excluded-address 10.20.50.1 10.20.50.99
ip dhcp excluded-address 10.20.50.176 10.20.50.255
ip dhcp excluded-address 10.20.60.1 10.20.60.19
ip dhcp excluded-address 10.20.60.136 10.20.60.255
ip dhcp excluded-address 10.20.70.1 10.20.70.99
ip dhcp excluded-address 10.20.70.176 10.20.70.255
ip dhcp pool IST-USERS
 network 10.20.20.0 255.255.255.0
 default-router 10.20.20.1
 dns-server 10.10.80.10
 domain-name corp.bosphorus.test
ip dhcp pool IST-VOICE
 network 10.20.50.0 255.255.255.0
 default-router 10.20.50.1
 option 150 ip 10.10.50.10
ip dhcp pool IST-WIFI-CORP
 network 10.20.60.0 255.255.255.0
 default-router 10.20.60.1
 dns-server 10.10.80.10
 domain-name corp.bosphorus.test
ip dhcp pool IST-WIFI-GUEST
 network 10.20.70.0 255.255.255.0
 default-router 10.20.70.1
 dns-server 192.0.2.53
!
ip access-list extended ACL-BRANCH-DATA-IN
 remark Users and corp Wi-Fi: local site (not MGMT or transits), approved HQ services, peer London users, internet
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 deny ip any 10.20.10.0 0.0.0.255
 deny ip any 10.20.0.0 0.0.0.255
 permit ip 10.20.0.0 0.0.255.255 10.20.0.0 0.0.255.255
 permit tcp 10.20.0.0 0.0.255.255 10.10.10.0 0.0.0.255 established
 permit icmp 10.20.0.0 0.0.255.255 10.10.10.0 0.0.0.255 echo-reply
 permit udp 10.20.0.0 0.0.255.255 host 10.10.80.10 eq domain
 permit tcp 10.20.0.0 0.0.255.255 host 10.10.80.10 eq domain
 permit udp 10.20.0.0 0.0.255.255 host 10.10.80.11 eq 1812
 permit udp 10.20.0.0 0.0.255.255 host 10.10.80.11 eq 1813
 permit tcp 10.20.0.0 0.0.255.255 host 10.10.80.13 eq www
 permit tcp 10.20.0.0 0.0.255.255 host 10.10.80.13 eq 443
 permit tcp 10.20.0.0 0.0.255.255 host 10.10.80.13 eq smtp
 permit tcp 10.20.0.0 0.0.255.255 host 10.10.80.13 eq pop3
 permit icmp 10.20.0.0 0.0.255.255 10.10.80.0 0.0.0.255 echo
 permit tcp 10.20.0.0 0.0.255.255 host 172.16.100.10 eq www
 permit tcp 10.20.0.0 0.0.255.255 host 172.16.100.10 eq 443
 permit ip 10.20.0.0 0.0.255.255 10.10.20.0 0.0.0.255
 permit ip 10.20.0.0 0.0.255.255 10.10.30.0 0.0.0.255
 permit ip 10.20.0.0 0.0.255.255 10.10.60.0 0.0.0.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.20.0.0 0.0.255.255 any
ip access-list extended ACL-BRANCH-VOICE-IN
 remark Voice: local site (not MGMT or transits), CME and voice subnets only
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 deny ip any 10.20.10.0 0.0.0.255
 deny ip any 10.20.0.0 0.0.0.255
 permit ip 10.20.50.0 0.0.0.255 10.20.0.0 0.0.255.255
 permit ip 10.20.50.0 0.0.0.255 10.10.50.0 0.0.0.255
 permit ip 10.20.50.0 0.0.0.255 10.30.50.0 0.0.0.255
 permit ip 10.20.50.0 0.0.0.255 10.40.50.0 0.0.0.255
 deny ip any any
ip access-list extended ACL-WIFI-GUEST-IN
 remark Guest Wi-Fi: HSRP, DHCP, own gateway, then internet only
 permit udp any host 224.0.0.102 eq 1985
 permit udp any any eq bootps
 permit icmp 10.20.70.0 0.0.0.255 10.20.70.0 0.0.0.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip 10.20.70.0 0.0.0.255 any
interface Vlan20
 ip access-group ACL-BRANCH-DATA-IN in
interface Vlan50
 ip access-group ACL-BRANCH-VOICE-IN in
interface Vlan60
 ip access-group ACL-BRANCH-DATA-IN in
interface Vlan70
 ip access-group ACL-WIFI-GUEST-IN in
!
interface GigabitEthernet1/0/22
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
interface Vlan900
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
! B-34: PT's 3650 rejects 'ip ospf network point-to-point' on an SVI, so this VLAN 900
! adjacency uses the broadcast type (DR/BDR). Both ends match, so it still forms.
router ospf 1
 router-id 10.255.255.12
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet1/0/22
 no passive-interface Vlan900
 area 1 authentication message-digest
 network 10.20.0.0 0.0.255.255 area 1
 network 10.255.255.12 0.0.0.0 area 1
! Local internet breakout: default route to IST-RTR-01. If this switch's router link
! fails, the static route disappears and traffic follows OSPF (via the other switch).
ip route 0.0.0.0 0.0.0.0 10.20.0.13
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
! B-51: PT rejects 'no ip http server' (no HTTP server runs anyway).
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! B-01: PT has no 'ip tacacs source-interface'; the AAA client registered on
! LON-SRV-AAA-01 is this device's outgoing interface IP (configs/servers/servers.md).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
! B-51: PT rejects 'logging trap informational'; the default trap level is used.
snmp-server community BSP-RO-Lab RO
! P0-16d: PT rejects an ACL on the community; ACL 99 still limits VTY access.
!
end
! After pasting: copy running-config startup-config
