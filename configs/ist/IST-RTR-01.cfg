!
! =====================================================================
! IST-RTR-01  (ISR4331)  -  Istanbul
! Branch router (30 staff): links to both site switches, internet breakout, CBAC firewall, GRE/IPsec to both London edges, OSPF area 1
! bosphorus-enterprise-net  |  lab-only credentials, see docs/lab-credentials.md
!
! Paste in global configuration mode (enable -> configure terminal).
! Sections are ordered by build phase. You can paste one phase at a time
! (see docs/build-guide.md) or the whole file at once.
! Tags "P0-xx" / "B-xx" mark a Packet Tracer limit found in Phase 0
! (docs/pt-support-matrix.md). The lines here already use the working fallback.
! =====================================================================
!
! Before anything else (needs a reload):
!   license boot level securityk9  ->  end  ->  write memory  ->  reload
!
! ===== Phase 2: base ===============================================
!
hostname IST-RTR-01
no ip domain-lookup
ip domain-name corp.bosphorus.test
service timestamps log datetime msec
service timestamps debug datetime msec
interface GigabitEthernet0/0/0
 description TO-ISP-A-Fa1/0
 no shutdown
interface GigabitEthernet0/0/1
 description TO-IST-SW-01-Gi1/0/22
 no shutdown
interface GigabitEthernet0/0/2
 description TO-IST-SW-02-Gi1/0/22
 no shutdown
!
! ===== Phase 6: LAN links, internet breakout =======================
!
interface Loopback0
 ip address 10.255.255.11 255.255.255.255
interface GigabitEthernet0/0/0
 ip address 198.51.100.10 255.255.255.252
 no cdp enable
interface GigabitEthernet0/0/1
 ip address 10.20.0.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
interface GigabitEthernet0/0/2
 ip address 10.20.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 Lab-Ospf-1
ip route 0.0.0.0 0.0.0.0 198.51.100.9
! No 'default-information originate': the switches point a static default at this
! router for local breakout; London's OSPF default is only their fallback.
!
ip access-list extended ACL-NAT
 remark Never translate traffic between internal sites
 deny ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 permit ip 10.20.0.0 0.0.255.255 any
ip nat inside source list ACL-NAT interface GigabitEthernet0/0/0 overload
interface GigabitEthernet0/0/0
 ip nat outside
interface GigabitEthernet0/0/1
 ip nat inside
interface GigabitEthernet0/0/2
 ip nat inside
!
! Stateful firewall: CBAC ('ip inspect') plus an inbound ACL, not a zone-based firewall.
! B-50: PT can't make a Tunnel a ZBF zone member (B-40), and ZBF drops traffic between a
! zone member and a non-member, so every LAN <-> tunnel packet was dropped (ADR 0015).
ip inspect name CBAC-OUT tcp
ip inspect name CBAC-OUT udp
ip inspect name CBAC-OUT icmp
ip access-list extended ACL-OUTSIDE-IN
 remark VPN peers only; replies to inside sessions are opened by CBAC
 permit udp host 198.51.100.2 host 198.51.100.10 eq isakmp
 permit udp host 198.51.100.6 host 198.51.100.10 eq isakmp
 permit esp host 198.51.100.2 host 198.51.100.10
 permit esp host 198.51.100.6 host 198.51.100.10
 permit gre host 198.51.100.2 host 198.51.100.10
 permit gre host 198.51.100.6 host 198.51.100.10
 permit icmp any any unreachable
 deny ip any any
! PT has no 'time-exceeded' ICMP keyword, so traceroutes from inside show '*' past this router.
interface GigabitEthernet0/0/0
 ip inspect CBAC-OUT out
 ip access-group ACL-OUTSIDE-IN in
!
! ===== Phase 6: GRE over IPsec to London, OSPF area 1 ==============
!
crypto isakmp policy 10
 encryption aes 256
 hash sha
 authentication pre-share
 group 5
 lifetime 86400
! P0-14a/b: PT supports only SHA-1 and DH group 5 for IKE. Must match both London edges.
crypto isakmp key Lab-Ike-1 address 198.51.100.2
crypto isakmp key Lab-Ike-1 address 198.51.100.6
crypto ipsec transform-set TS-GRE-LON esp-aes 256 esp-sha-hmac
! P0-14c/d: PT supports only esp-sha-hmac and tunnel mode. Must match both London edges.
access-list 110 remark GRE to LON-EDGE-01
access-list 110 permit gre host 198.51.100.10 host 198.51.100.2
access-list 120 remark GRE to LON-EDGE-02
access-list 120 permit gre host 198.51.100.10 host 198.51.100.6
crypto map CM-WAN 10 ipsec-isakmp
 description LON-EDGE-01 (primary)
 set peer 198.51.100.2
 set transform-set TS-GRE-LON
 match address 110
crypto map CM-WAN 20 ipsec-isakmp
 description LON-EDGE-02 (backup)
 set peer 198.51.100.6
 set transform-set TS-GRE-LON
 match address 120
interface GigabitEthernet0/0/0
 crypto map CM-WAN
!
! B-40: on the ISR4331 a Tunnel interface accepts only 'ip address', 'tunnel ...' and
! 'shutdown' (no description, ip mtu, ip ospf ..., zone-member). Both tunnels therefore
! share the default OSPF cost; EDGE-01 still wins because EDGE-02's core link costs 1000.
! Area 1 MD5 still forms over the tunnels (B-40).
interface Tunnel0
 ip address 10.255.1.2 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 198.51.100.2
interface Tunnel1
 ip address 10.255.1.6 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 198.51.100.6
!
router ospf 1
 router-id 10.255.255.11
 auto-cost reference-bandwidth 10000
 passive-interface GigabitEthernet0/0/0
 passive-interface Loopback0
! B-41: PT can't name tunnels in 'passive-interface' and drops them on reload, so
! 'passive-interface default' would silence the tunnels. Passive interfaces are listed instead.
 area 1 authentication message-digest
 network 10.255.1.0 0.0.0.7 area 1
 network 10.20.0.0 0.0.0.15 area 1
! B-47: the SW-01 link is 10.20.0.12/30, not 10.20.0.0/30: PT confuses a /30 with the
! same address as a summary (10.20.0.0/16), so no subnet starts at the site's base address.
 network 10.255.255.11 0.0.0.0 area 1
!
! ===== Phase 7: management plane ===================================
!
service password-encryption
enable secret Lab-Enable-1
username netadmin privilege 15 secret Lab-Admin-1
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 3 within 60
! B-51: PT rejects 'no ip http server' (no HTTP server runs anyway).
banner motd #
Authorized access only. bosphorus-enterprise-net lab environment.
All activity is logged.
#
!
access-list 99 remark MGMT-SUBNET-ONLY
access-list 99 permit 10.10.10.0 0.0.0.255
!
aaa new-model
tacacs-server host 10.10.80.11 key Lab-Tacacs-1
! B-01: PT has no 'ip tacacs source-interface'; the AAA client registered on
! LON-SRV-AAA-01 is this device's outgoing interface IP (configs/servers/servers.md).
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
line vty 0 4
 access-class 99 in
 transport input ssh
 login authentication default
 exec-timeout 10 0
 logging synchronous
!
ntp authentication-key 1 md5 Lab-Ntp-1
ntp authenticate
ntp trusted-key 1
ntp server 10.10.80.12 key 1
logging host 10.10.80.12
! B-51: PT rejects 'logging trap informational'; the default trap level is used.
snmp-server community BSP-RO-Lab RO
! P0-16d: PT rejects an ACL on the community; ACL 99 still limits VTY access.
!
! ===== Phase 8: QoS ================================================
!
ip access-list extended ACL-QOS-VOICE
 remark RTP from phones at every site
 permit udp 10.10.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.20.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.30.50.0 0.0.0.255 any range 16384 32767
 permit udp 10.40.50.0 0.0.0.255 any range 16384 32767
ip access-list extended ACL-QOS-SIGNALING
 remark SCCP between branch phones and CME
 permit tcp 10.20.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.20.50.0 0.0.0.255
 permit tcp 10.30.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.30.50.0 0.0.0.255
 permit tcp 10.40.50.0 0.0.0.255 host 10.10.50.10 eq 2000
 permit tcp host 10.10.50.10 eq 2000 10.40.50.0 0.0.0.255
ip access-list extended ACL-QOS-CRITICAL
 remark Branch users <-> London servers
 permit ip 10.20.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.20.0.0 0.0.255.255
 permit ip 10.40.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.40.0.0 0.0.255.255
 permit ip 10.30.0.0 0.0.255.255 10.10.80.0 0.0.0.255
 permit ip 10.10.80.0 0.0.0.255 10.30.0.0 0.0.255.255
ip access-list extended ACL-QOS-SCAVENGER
 remark Guest Wi-Fi at every site
 permit ip 10.10.70.0 0.0.0.255 any
 permit ip 10.20.70.0 0.0.0.255 any
 permit ip 10.30.70.0 0.0.0.255 any
 permit ip 10.40.70.0 0.0.0.255 any
!
class-map match-any CM-MARK-VOICE
 match access-group name ACL-QOS-VOICE
class-map match-any CM-MARK-SIGNALING
 match access-group name ACL-QOS-SIGNALING
class-map match-any CM-MARK-CRITICAL
 match access-group name ACL-QOS-CRITICAL
class-map match-any CM-MARK-SCAVENGER
 match access-group name ACL-QOS-SCAVENGER
policy-map PM-MARK-IN
 class CM-MARK-VOICE
  set ip dscp ef
 class CM-MARK-SIGNALING
  set ip dscp cs3
 class CM-MARK-CRITICAL
  set ip dscp af31
 class CM-MARK-SCAVENGER
  set ip dscp cs1
!
class-map match-any CM-VOICE
 match ip dscp ef
class-map match-any CM-SIGNALING
 match ip dscp cs3
class-map match-any CM-CRITICAL
 match ip dscp af31
class-map match-any CM-SCAVENGER
 match ip dscp cs1
policy-map PM-WAN-OUT
 class CM-VOICE
  priority percent 10
 class CM-SIGNALING
  bandwidth percent 5
 class CM-CRITICAL
  bandwidth percent 20
 class CM-SCAVENGER
  bandwidth percent 1
 class class-default
  fair-queue
interface GigabitEthernet0/0/1
 service-policy input PM-MARK-IN
interface GigabitEthernet0/0/2
 service-policy input PM-MARK-IN
interface GigabitEthernet0/0/0
 service-policy output PM-WAN-OUT
!
end
! After pasting: copy running-config startup-config
